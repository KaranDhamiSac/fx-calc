<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>fx Calc</title>
<meta name="description" content="Offline Casio-style scientific calculator">
<meta name="theme-color" content="#16171b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="fx Calc">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="brand"><span class="brand-name">fx Calc</span><span class="brand-model">SCIENTIFIC CALCULATOR</span></div>
  <div id="lcd">
    <div id="status"></div>
    <div id="screen"></div>
  </div>
  <div id="keys"></div>
</div>
<label id="haptic" aria-hidden="true"><input type="checkbox" switch></label>
<script src="engine.js"></script>
<script src="engine-x.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
